[tox]
envlist = precommit,py{310,311,312,313}
minversion = 4.0
parallel = auto

[testenv]
deps =
  -rrequirements.txt
  coverage
  mypy
  pytest
commands =
  coverage run -m pytest
  mypy pyflp

[testenv:precommit]
skip_install = True
deps = pre-commit
commands = pre-commit run --all-files

[testenv:docs]
# Not in envlist or CI (its linkcheck depends on external sites); run it with
# `tox -e docs`.
# Exclude GH Actions Mac OS runners due to PyEnchant (needed by sphinxcontrib.spelling)
# issue on Apple silicon, see https://github.com/pyenchant/pyenchant/issues/265
platform = ^((?!darwin).)*$
base_python = py310
deps =
  -rdocs/requirements.txt
  -rrequirements.txt
commands =
  sphinx-build -b linkcheck docs docs/_build/linkcheck
