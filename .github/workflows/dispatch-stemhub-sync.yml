name: dispatch-stemhub-sync

# Tells StemHub that main moved. StemHub's sync-pyflp-submodule workflow
# listens for this event and opens a pull request to its dev branch that
# bumps the backend/vendor/PyFLP_v2 submodule.
#
# Needs the STEMHUB_REPO_DISPATCH_TOKEN secret: a token allowed to write the
# contents of stemhub-org/Stemhub. Without it the job only logs a warning.
#
# Add that secret only once StemHub's main branch carries the sync workflow
# that targets dev: repository_dispatch runs the copy on StemHub's default
# branch, and an older copy there would open the bump pull request to main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dispatch:
    if: github.repository == 'stemhub-org/PyFLP_v2'
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.STEMHUB_REPO_DISPATCH_TOKEN }}
    steps:
      - name: Report a missing token
        if: env.DISPATCH_TOKEN == ''
        run: echo "::warning::STEMHUB_REPO_DISPATCH_TOKEN is not set, so StemHub was not notified"
      - name: Trigger StemHub submodule update
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: stemhub-org/Stemhub
          event-type: pyflp_upstream_push
          client-payload: |
            {
              "source_repository": "${{ github.repository }}",
              "source_ref": "${{ github.ref }}",
              "source_sha": "${{ github.sha }}"
            }
