name: test

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CPython versions StemHub's backend runs on, each with the tox
        # environments it runs. pre-commit runs once, on 3.11.
        include:
          - python-version: "3.10"
            tox-envs: py310
          - python-version: "3.11"
            tox-envs: py311,precommit
          - python-version: "3.12"
            tox-envs: py312
          - python-version: "3.13"
            tox-envs: py313
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install tox
      - name: Test with tox
        run: tox run -e ${{ matrix.tox-envs }}
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifacts-${{ matrix.python-version }}
          path: |
            .coverage
            .coverage.*
          include-hidden-files: true
  upload-to-codecov:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage[toml]
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-artifacts-*
          merge-multiple: true
      - name: Coverage data preparation for shitty codecov
        run: coverage combine
      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
